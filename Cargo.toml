[package]
name = "vessel"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Ship sensor simulator & NMEA 0183 / MQTT / WebSocket gateway"
authors = ["Ridwan Ahmad Fauzan"]

[dependencies]
actix-web = "4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26.1"
futures-util = "0.3.31"
actix-cors = "0.6"
http = "0.2.12"
time = "0.3"
rumqttc = "0.24"
world_magnetic_model = "0.4.0"
uom = "0.37.0"
chrono = { version = "0.4", features = ["serde"] }
rand_distr = "0.5.1"
rand = "0.9.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "6.0.0", features = ["actix_extras", "chrono"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["actix-web"] }
