services:
  - type: web
    name: vessel-nddu
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/hf/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: RUST_LOG
        value: info
      - key: MQTT_HOST
        value: 127.0.0.1
      - key: MQTT_PORT
        value: "1883"
